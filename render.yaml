services:
  - type: web
    name: voice-call-agent
    env: python
    buildCommand: pip install -r requirements.txt && pip install -e .
    startCommand: PYTHONPATH=src uvicorn voice_call_agent.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONPATH
        value: src
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_NAME
        value: Voice Call Agent
      - key: ENVIRONMENT
        value: production

      # LLM configuration
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: EXPLABS_API_KEY
        sync: false
      - key: EXPLABS_BASE_URL
        value: https://api.experientiallabs.ai/v1

      # Sarvam AI speech configuration
      - key: SARVAM_API_KEY
        sync: false
      - key: SARVAM_DEFAULT_LANGUAGES
        value: te-IN,en-IN,hi-IN
      - key: SARVAM_PACE
        value: "1.0"
      - key: SARVAM_VOICE_TE_IN
        value: kavitha
      - key: SARVAM_VOICE_HI_IN
        value: ritu
      - key: SARVAM_VOICE_EN_IN
        value: ishita

      # Telephony configuration
      - key: TELEPHONY_PROVIDER
        value: exotel
      - key: VALIDATE_TELEPHONY_SIGNATURES
        value: "false"
      - key: EXOTEL_ACCOUNT_SID
        sync: false
      - key: EXOTEL_API_KEY
        sync: false
      - key: EXOTEL_API_TOKEN
        sync: false
      - key: EXOTEL_CALLER_ID
        sync: false
      - key: EXOTEL_APP_ID
        sync: false
      - key: EXOTEL_SUBDOMAIN
        value: api.exotel.com

      # Twilio fallback
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
